<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Prop Hunt</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #5c93c4;
            transition: background-color 0.5s ease;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 360px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 8px;
            color: white;
            text-align: center;
            z-index: 10;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        #health-container {
            color: #2ecc71;
        }

        #score-container {
            color: #f1c40f;
            display: none;
        }

        #button-container {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .toggle-btn {
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .toggle-btn.active {
            background: rgba(46, 204, 113, 0.8);
            border-color: #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.8);
        }

        #attack-btn.active {
            background: rgba(231, 76, 60, 0.8);
            border-color: #e74c3c;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.8);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }

        /* Stamina Wheel (BotW style) */
        #stamina-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #stamina-canvas {
            width: 100%;
            height: 100%;
        }

        #touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }

        #action-btn-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 10;
            align-items: flex-end;
        }

        .action-circle-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 3px solid rgba(255, 255, 255, 0.8);
        }

        #action-btn {
            background: rgba(231, 76, 60, 0.8);
        }
        #action-btn:active {
            background: rgba(192, 57, 43, 0.9);
            transform: scale(0.95);
        }

        #melee-btn {
            background: rgba(192, 57, 43, 0.9);
            border-color: #f1c40f;
            display: none;
            font-size: 11px;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
        }
        #melee-btn:active {
            transform: scale(0.95);
        }

        #jump-btn {
            background: rgba(52, 152, 219, 0.8);
        }
        #jump-btn:active {
            background: rgba(41, 128, 185, 0.9);
            transform: scale(0.95);
        }

        #sprint-btn {
            background: rgba(241, 196, 15, 0.85);
            border-color: #f39c12;
            color: #fff;
        }
        #sprint-btn.active-sprint {
            background: rgba(211, 84, 0, 0.95);
            border-color: #e67e22;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.9);
        }
        #sprint-btn:active {
            transform: scale(0.95);
        }

        #joystick-base {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            z-index: 8;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(231, 76, 60, 0);
            pointer-events: none;
            z-index: 15;
            transition: background 0.15s ease;
        }

        #wasted-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        @keyframes redBlueFlash {
            0% { background: rgba(255, 0, 0, 0.7); }
            50% { background: rgba(0, 0, 255, 0.7); }
            100% { background: rgba(255, 0, 0, 0.7); }
        }

        #wasted-text {
            font-family: 'Impact', sans-serif;
            font-size: 80px;
            color: #b30000;
            letter-spacing: 4px;
            text-shadow: 0 0 10px black, 0 0 20px black;
        }

        @keyframes pulseEffect {
            0% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.3; transform: scale(0.95); }
        }

        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            color: white;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }

        #menu-title {
            font-family: 'Impact', sans-serif;
            font-size: 80px;
            color: #f1c40f;
            letter-spacing: 4px;
            text-shadow: 0 0 15px black, 0 0 30px rgba(241, 196, 15, 0.6);
            animation: pulseEffect 1.8s ease-in-out infinite;
            margin-bottom: 30px;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #2ecc71;
            color: white;
            border: 2px solid #27ae60;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        #start-btn:active {
            transform: scale(0.95);
            background: #27ae60;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>PROP HUNT</div>
        <div id="health-container">HEALTH: <span id="health-val">100</span></div>
        <div id="score-container">KNOCKDOWNS: <span id="score-val">0</span></div>
    </div>
    
    <div id="button-container">
        <button id="night-mode-btn" class="toggle-btn">NIGHT MODE</button>
        <button id="attack-btn" class="toggle-btn">ATTACK MODE</button>
    </div>

    <div id="crosshair"></div>
    <div id="stamina-container">
        <canvas id="stamina-canvas" width="100" height="100"></canvas>
    </div>

    <div id="damage-flash"></div>
    
    <div id="wasted-screen">
        <div id="wasted-text">WASTED</div>
    </div>

    <div id="touch-controls"></div>
    
    <div id="action-btn-container">
        <button id="melee-btn" class="action-circle-btn">🗡️<br>MELEE</button>
        <button id="sprint-btn" class="action-circle-btn">⚡<br>SPRINT</button>
        <button id="jump-btn" class="action-circle-btn">JUMP</button>
        <button id="action-btn" class="action-circle-btn">PICK UP<br>/ THROW</button>
    </div>
    
    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <div id="instructions">
        <div id="menu-title">PROP HUNT</div>
        <button id="start-btn">PLAY</button>
    </div>

    <script src="three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let ground, grid;
        let knife;
        let targets = [];
        let enemyKnives = [];
        let droppedEnemyKnives = [];
        let obstacles = [];

        // Lighting & Environment
        let ambientLight, sunLight;
        let flashlight;
        let nightSkyGroup;
        let isNightMode = false;
        let isAttackMode = false;
        let isDead = false;

        // Player Health & Score Stats
        let playerHealth = 100;
        let knockdownScore = 0;
        const healthValEl = document.getElementById('health-val');
        const scoreValEl = document.getElementById('score-val');
        const scoreContainerEl = document.getElementById('score-container');
        const damageFlashEl = document.getElementById('damage-flash');
        const wastedScreen = document.getElementById('wasted-screen');
        const wastedText = document.getElementById('wasted-text');

        // Stamina System (BotW style) with Tap-to-Sprint
        let stamina = 100;
        const maxStamina = 100;
        let isSprinting = false;
        let staminaRechargeTimer = 0;
        const STAMINA_DRAIN_RATE = 40; // drains per second
        const STAMINA_RECHARGE_RATE = 35; // recharges per second
        const STAMINA_RECHARGE_DELAY = 1.0; // 1 second wait before auto-recharge
        const staminaContainer = document.getElementById('stamina-container');
        const staminaCanvas = document.getElementById('stamina-canvas');
        const staminaCtx = staminaCanvas.getContext('2d');

        // Throw Momentum Tracking
        let lastSprintTapTime = 0;

        // Knife Mechanics
        let isHoldingKnife = true;
        let isStuckInTarget = false;
        let stuckTarget = null;
        let knifeVelocity = new THREE.Vector3();
        let spinAxis = new THREE.Vector3();
        let spinSpeed = 0;
        const GRAVITY = 12;
        const PICKUP_DISTANCE = 5.0;
        const BASE_THROW_FORCE = 22;
        const MELEE_RANGE = 2.5;
        let closestTargetInRange = null;

        // Player Physics & Movement State
        const playerPosition = new THREE.Vector3(0, 1.6, 5);
        let playerVerticalVelocity = 0;
        let isJumping = false;
        const PLAYER_HEIGHT = 1.6;
        const JUMP_FORCE = 6.0;

        let cameraYaw = 0;
        let cameraPitch = 0;

        // Touch Input Tracking
        let moveTouchId = null;
        let lookTouchId = null;
        let moveTouchStart = { x: 0, y: 0 };
        let moveInput = { x: 0, y: 0 };
        let lastLookPos = { x: 0, y: 0 };

        let prevTime = performance.now();
        let targetSpawnTimer = 0;

        const instructions = document.getElementById('instructions');
        const startBtn = document.getElementById('start-btn');
        const actionBtn = document.getElementById('action-btn');
        const meleeBtn = document.getElementById('melee-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const sprintBtn = document.getElementById('sprint-btn');
        const nightModeBtn = document.getElementById('night-mode-btn');
        const attackBtn = document.getElementById('attack-btn');
        const touchContainer = document.getElementById('touch-controls');
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5c93c4);
            scene.fog = new THREE.FogExp2(0x5c93c4, 0.008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xfff8e7, 1.1);
            sunLight.position.set(30, 50, 30);
            sunLight.castShadow = true;
            scene.add(sunLight);

            flashlight = new THREE.SpotLight(0xffffff, 0, 40, Math.PI / 6, 0.5, 1.5);
            flashlight.position.set(0, 0, 0);
            flashlight.target.position.set(0, 0, -10);
            scene.add(flashlight);
            scene.add(flashlight.target);

            createNightEnvironment();

            const groundGeometry = new THREE.PlaneGeometry(200, 200);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x3b7a32, roughness: 0.85 });
            ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            grid = new THREE.GridHelper(200, 50, 0x4f9c44, 0x2c5c24);
            grid.position.y = 0.01;
            scene.add(grid);

            spawnObstacles();

            knife = createKnifeModel(false);
            scene.add(knife);

            resetTargets();

            setupTouchEvents();

            startBtn.addEventListener('click', () => {
                instructions.style.display = 'none';
            });

            actionBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (!isDead) interactWithKnife();
            });

            meleeBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (!isDead && isHoldingKnife && closestTargetInRange) {
                    performMelee(closestTargetInRange);
                }
            });

            jumpBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (!isDead) triggerJump();
            });

            // Tap-to-Sprint Toggle Button Event
            sprintBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (isDead) return;
                
                if (!isSprinting) {
                    if (stamina > 5) {
                        isSprinting = true;
                        lastSprintTapTime = performance.now();
                        sprintBtn.classList.add('active-sprint');
                        staminaRechargeTimer = 0;
                    }
                } else {
                    isSprinting = false;
                    sprintBtn.classList.remove('active-sprint');
                }
            });

            nightModeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleNightMode();
            });

            attackBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleAttackMode();
            });

            window.addEventListener('resize', onWindowResize);
            drawStaminaWheel();
        }

        function drawStaminaWheel() {
            staminaCtx.clearRect(0, 0, 100, 100);
            if (stamina >= maxStamina && !isSprinting) return;

            const centerX = 50;
            const centerY = 50;
            const radius = 36;
            const innerRadius = 26;

            staminaCtx.beginPath();
            staminaCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            staminaCtx.arc(centerX, centerY, innerRadius, Math.PI * 2, 0, true);
            staminaCtx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            staminaCtx.fill();

            const fillFraction = stamina / maxStamina;
            const startAngle = -Math.PI / 2;
            const endAngle = startAngle + (Math.PI * 2 * fillFraction);

            staminaCtx.beginPath();
            staminaCtx.arc(centerX, centerY, radius, startAngle, endAngle, false);
            staminaCtx.arc(centerX, centerY, innerRadius, endAngle, startAngle, true);
            staminaCtx.closePath();
            
            staminaCtx.fillStyle = stamina < 25 ? 'rgba(243, 156, 18, 0.9)' : 'rgba(46, 204, 113, 0.9)';
            staminaCtx.fill();
        }

        function spawnObstacles() {
            const logMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
            const stumpMat = new THREE.MeshStandardMaterial({ color: 0x4a3322, roughness: 0.9 });

            for (let i = 0; i < 18; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 8 + Math.random() * 55;
                const x = Math.sin(angle) * distance;
                const z = -Math.cos(angle) * distance;

                if (Math.hypot(x, z) < 5) continue;

                if (Math.random() < 0.6) {
                    const logGeo = new THREE.CylinderGeometry(0.5, 0.5, 4 + Math.random() * 3, 12);
                    const log = new THREE.Mesh(logGeo, logMat);
                    log.position.set(x, 0.5, z);
                    log.rotation.z = Math.PI / 2;
                    log.rotation.y = Math.random() * Math.PI;
                    log.castShadow = true;
                    log.receiveShadow = true;
                    scene.add(log);
                    obstacles.push({ mesh: log, type: 'log', radius: 0.6, length: 5 });
                } else {
                    const stumpGeo = new THREE.CylinderGeometry(0.8, 1.0, 1.5, 10);
                    const stump = new THREE.Mesh(stumpGeo, stumpMat);
                    stump.position.set(x, 0.75, z);
                    stump.castShadow = true;
                    stump.receiveShadow = true;
                    scene.add(stump);
                    obstacles.push({ mesh: stump, type: 'stump', radius: 0.9 });
                }
            }
        }

        function createNightEnvironment() {
            nightSkyGroup = new THREE.Group();

            const moonGeo = new THREE.SphereGeometry(6, 32, 32);
            const moonMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
            const moon = new THREE.Mesh(moonGeo, moonMat);
            moon.position.set(60, 80, -120);
            nightSkyGroup.add(moon);

            const starGeo = new THREE.BufferGeometry();
            const starCount = 300;
            const starPositions = [];

            for (let i = 0; i < starCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 180 + Math.random() * 40;

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = Math.abs(r * Math.cos(phi)) + 20;
                const z = r * Math.sin(phi) * Math.sin(theta);

                starPositions.push(x, y, z);
            }

            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.8, sizeAttenuation: true });
            const stars = new THREE.Points(starGeo, starMat);
            nightSkyGroup.add(stars);

            nightSkyGroup.visible = false;
            scene.add(nightSkyGroup);
        }

        function toggleNightMode() {
            isNightMode = !isNightMode;
            nightModeBtn.classList.toggle('active', isNightMode);

            if (isNightMode) {
                scene.background.set(0x050b14);
                scene.fog.color.set(0x050b14);
                scene.fog.density = 0.015;
                ambientLight.intensity = 0.08;
                sunLight.intensity = 0.15;
                sunLight.color.set(0x88bbff);
                flashlight.intensity = 4.5;
                nightSkyGroup.visible = true;
                ground.material.color.set(0x112211);
                grid.material.color.set(0x1c331c);
            } else {
                scene.background.set(0x5c93c4);
                scene.fog.color.set(0x5c93c4);
                scene.fog.density = 0.008;
                ambientLight.intensity = 0.75;
                sunLight.intensity = 1.1;
                sunLight.color.set(0xfff8e7);
                flashlight.intensity = 0;
                nightSkyGroup.visible = false;
                ground.material.color.set(0x3b7a32);
                grid.material.color.set(0x4f9c44);
            }
        }

        function resetTargets() {
            targets.forEach(t => scene.remove(t));
            targets = [];

            // Increased count for Attack Mode (e.g., 25 simultaneous enemies)
            const count = isAttackMode ? 25 : 3;
            for (let i = 0; i < count; i++) {
                spawnTarget();
            }
        }

        function toggleAttackMode() {
            isAttackMode = !isAttackMode;
            attackBtn.classList.toggle('active', isAttackMode);
            
            if (isAttackMode) {
                scoreContainerEl.style.display = 'block';
                knockdownScore = 0;
                scoreValEl.textContent = knockdownScore;
            } else {
                scoreContainerEl.style.display = 'none';
            }

            resetTargets();
        }

        function createKnifeModel(isEnemy) {
            const knifeGroup = new THREE.Group();
            
            const bladeMat = new THREE.MeshStandardMaterial({ 
                color: isEnemy ? 0x111111 : 0x222222, 
                metalness: 0.9, 
                roughness: 0.25 
            });
            
            const bladeGeo = new THREE.BoxGeometry(0.07, 0.52, 0.015);
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 0.31;
            blade.castShadow = true;
            knifeGroup.add(blade);

            const tipGeo = new THREE.ConeGeometry(0.035, 0.15, 4);
            const tip = new THREE.Mesh(tipGeo, bladeMat);
            tip.rotation.y = Math.PI / 4;
            tip.position.y = 0.645;
            tip.castShadow = true;
            knifeGroup.add(tip);

            const handleGeo = new THREE.BoxGeometry(0.06, 0.38, 0.025);
            const handleMat = new THREE.MeshStandardMaterial({ 
                color: isEnemy ? 0x440000 : 0x111111, 
                roughness: 0.8 
            });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -0.19;
            handle.castShadow = true;
            knifeGroup.add(handle);

            const accentGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.03, 12);
            const accentMat = isEnemy ? 
                new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.3 }) : 
                new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.8, roughness: 0.2 });
            
            const accent = new THREE.Mesh(accentGeo, accentMat);
            accent.rotation.z = Math.PI / 2;
            accent.position.set(0, -0.34, 0);
            knifeGroup.add(accent);

            knifeGroup.scale.set(1.2, 1.2, 1.2);
            return knifeGroup;
        }

        function spawnTarget() {
            const targetGroup = new THREE.Group();

            const angle = Math.random() * Math.PI * 2;
            const distance = isAttackMode ? (15 + Math.random() * 45) : (8 + Math.random() * 7);
            const height = 1.2 + Math.random() * 1.5;

            const spawnX = playerPosition.x + Math.sin(angle) * distance;
            const spawnZ = playerPosition.z - Math.cos(angle) * distance;
            
            targetGroup.position.set(spawnX, height, spawnZ);
            targetGroup.lookAt(playerPosition.x, height, playerPosition.z);

            const radii = [1.0, 0.75, 0.5, 0.25];
            const colors = [0xffffff, 0xe74c3c, 0xffffff, 0xe74c3c];

            for (let i = 0; i < radii.length; i++) {
                const ringGeo = new THREE.CylinderGeometry(radii[i], radii[i], 0.1, 32);
                const ringMat = new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.4 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.castShadow = true;
                ring.receiveShadow = true;
                targetGroup.add(ring);
            }

            let combatStyle = 0;
            if (isAttackMode) {
                combatStyle = Math.random() < 0.4 ? 1 : (Math.random() < 0.7 ? 2 : 3);
            } else {
                combatStyle = Math.floor(Math.random() * 3);
            }

            const speedMultiplier = isAttackMode ? 1.6 : 1.0;
            const speedFactor = (Math.random() < 0.4 ? (0.6 + Math.random() * 0.6) : (1.6 + Math.random() * 1.8)) * speedMultiplier;

            targetGroup.userData = {
                baseY: height,
                hoverSpeed: (2 + Math.random() * 2) * speedMultiplier,
                hoverOffset: Math.random() * Math.PI * 2,
                behavior: combatStyle,
                moveDirection: 1,
                moveSpeed: speedFactor,
                circleAngle: angle,
                circleRadius: 8 + Math.random() * 14,
                circleSpeed: (Math.random() - 0.5) * 1.2 * speedMultiplier,
                isHit: false,
                hitTimer: 0,
                throwTimer: Math.random() * 2.0
            };

            scene.add(targetGroup);
            targets.push(targetGroup);
        }

        function setupTouchEvents() {
            touchContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
            touchContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
            touchContainer.addEventListener('touchend', handleTouchEnd, { passive: false });
            touchContainer.addEventListener('touchcancel', handleTouchEnd, { passive: false });
        }

        function handleTouchStart(e) {
            if (isDead) return;
            e.preventDefault();
            const halfWidth = window.innerWidth / 2;

            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];

                if (touch.clientX < halfWidth && moveTouchId === null) {
                    moveTouchId = touch.identifier;
                    moveTouchStart = { x: touch.clientX, y: touch.clientY };
                    moveInput = { x: 0, y: 0 };

                    joystickBase.style.display = 'block';
                    joystickBase.style.left = touch.clientX + 'px';
                    joystickBase.style.top = touch.clientY + 'px';
                    joystickStick.style.transform = 'translate(-50%, -50%)';
                }
                else if (touch.clientX >= halfWidth && lookTouchId === null) {
                    lookTouchId = touch.identifier;
                    lastLookPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        }

        function handleTouchMove(e) {
            if (isDead) return;
            e.preventDefault();

            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];

                if (touch.identifier === moveTouchId) {
                    const deltaX = touch.clientX - moveTouchStart.x;
                    const deltaY = touch.clientY - moveTouchStart.y;
                    const maxRadius = 45;

                    const distance = Math.min(Math.hypot(deltaX, deltaY), maxRadius);
                    const angle = Math.atan2(deltaY, deltaX);

                    const stickX = Math.cos(angle) * distance;
                    const stickY = Math.sin(angle) * distance;

                    joystickStick.style.transform = `translate(calc(-50% + ${stickX}px), calc(-50% + ${stickY}px))`;
                    
                    moveInput.x = - (stickX / maxRadius);
                    moveInput.y = stickY / maxRadius;
                }

                if (touch.identifier === lookTouchId) {
                    const deltaX = touch.clientX - lastLookPos.x;
                    const deltaY = touch.clientY - lastLookPos.y;

                    const sensitivity = 0.005;
                    cameraYaw -= deltaX * sensitivity;
                    cameraPitch -= deltaY * sensitivity;
                    cameraPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraPitch));

                    lastLookPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        }

        function handleTouchEnd(e) {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];

                if (touch.identifier === moveTouchId) {
                    moveTouchId = null;
                    moveInput = { x: 0, y: 0 };
                    joystickBase.style.display = 'none';
                }
                if (touch.identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        }

        function triggerJump() {
            if (!isJumping && playerPosition.y <= PLAYER_HEIGHT + 0.01) {
                playerVerticalVelocity = JUMP_FORCE;
                isJumping = true;
            }
        }

        function performMelee(target) {
            if (!target || target.userData.isHit || !isHoldingKnife) return;
            
            target.userData.isHit = true;
            
            // Print and update live count of knocked down enemies
            if (isAttackMode) {
                knockdownScore++;
                scoreValEl.textContent = knockdownScore;
                console.log(`Enemy knocked down! Total knockdowns: ${knockdownScore}`);
            }
            
            scene.attach(knife);
            knife.position.copy(target.worldToLocal(playerPosition.clone().add(new THREE.Vector3(0, 0.2, 0))));
            knife.scale.set(1.2, 1.2, 1.2).divide(target.scale);
            knife.rotation.set(0, 0, 0);
            knife.rotateX(Math.PI / 2);
            
            isStuckInTarget = true;
            stuckTarget = target;
            isHoldingKnife = false;
        }

        function interactWithKnife() {
            if (isHoldingKnife) {
                isHoldingKnife = false;
                isStuckInTarget = false;
                stuckTarget = null;

                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);

                const timeSinceSprintTap = (performance.now() - lastSprintTapTime) / 1000;
                const recentSprintBonus = (isSprinting || timeSinceSprintTap <= 1.8) ? 2.25 : 1.0;

                knife.position.copy(camera.position).add(cameraDirection.clone().multiplyScalar(1));
                knife.quaternion.copy(camera.quaternion);

                knifeVelocity.copy(cameraDirection).multiplyScalar(BASE_THROW_FORCE * recentSprintBonus);
                knifeVelocity.y += 2.5 * recentSprintBonus;

                spinAxis.set(0, 1, 0).cross(cameraDirection).normalize();
                spinSpeed = 16.0 * recentSprintBonus;

            } else {
                const knifeWorldPos = new THREE.Vector3();
                knife.getWorldPosition(knifeWorldPos);

                if (camera.position.distanceTo(knifeWorldPos) <= PICKUP_DISTANCE) {
                    isHoldingKnife = true;
                    isStuckInTarget = false;
                    stuckTarget = null;
                    scene.attach(knife); 
                    knife.scale.set(1.2, 1.2, 1.2);
                    knife.rotation.set(0, 0, 0);
                    return;
                }

                for (let i = droppedEnemyKnives.length - 1; i >= 0; i--) {
                    const dk = droppedEnemyKnives[i];
                    if (camera.position.distanceTo(dk.position) <= PICKUP_DISTANCE) {
                        scene.remove(dk);
                        droppedEnemyKnives.splice(i, 1);

                        scene.remove(knife);
                        knife = dk;
                        isHoldingKnife = true;
                        isStuckInTarget = false;
                        stuckTarget = null;
                        scene.attach(knife);
                        knife.scale.set(1.2, 1.2, 1.2);
                        knife.rotation.set(0, 0, 0);
                        break;
                    }
                }
            }
        }

        function takeDamage() {
            if (isDead) return;

            const damage = isAttackMode ? (Math.floor(Math.random() * 11) + 12) : (Math.floor(Math.random() * 11) + 8);
            playerHealth = Math.max(0, playerHealth - damage);
            healthValEl.textContent = playerHealth;

            damageFlashEl.style.background = 'rgba(231, 76, 60, 0.4)';
            setTimeout(() => {
                damageFlashEl.style.background = 'rgba(231, 76, 60, 0)';
            }, 150);

            if (playerHealth <= 0) {
                triggerWastedState();
            }
        }

        function triggerWastedState() {
            isDead = true;
            wastedScreen.style.opacity = '1';
            wastedScreen.style.animation = 'redBlueFlash 0.6s steps(1, end) infinite';
            wastedText.style.animation = 'pulseEffect 1.8s ease-in-out infinite';
            joystickBase.style.display = 'none';
        }

        function spawnEnemyKnife(fromTarget) {
            const eKnife = createKnifeModel(true);
            eKnife.position.copy(fromTarget.position);
            
            const targetPos = playerPosition.clone();
            targetPos.y = 1.6;

            const throwDir = targetPos.clone().sub(fromTarget.position).normalize();
            const enemyThrowSpeed = isAttackMode ? 18 : 12;
            const velocity = throwDir.clone().multiplyScalar(enemyThrowSpeed);
            velocity.y += 2.5;

            const axis = new THREE.Vector3(0, 1, 0).cross(throwDir).normalize();
            eKnife.lookAt(targetPos);

            scene.add(eKnife);
            enemyKnives.push({
                mesh: eKnife,
                velocity: velocity,
                spinAxis: axis,
                spinSpeed: 18.0
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (!isDead) {
                targetSpawnTimer += delta;
                const spawnInterval = isAttackMode ? 1.2 : 4.0;
                const maxTargets = isAttackMode ? 25 : 4;

                if (targetSpawnTimer >= spawnInterval && targets.length < maxTargets) {
                    targetSpawnTimer = 0;
                    spawnTarget();
                }

                // Stamina & Sprint Logic
                const isMoving = Math.abs(moveInput.x) > 0.05 || Math.abs(moveInput.y) > 0.05;
                if (isSprinting && isMoving && stamina > 0) {
                    stamina = Math.max(0, stamina - STAMINA_DRAIN_RATE * delta);
                    staminaRechargeTimer = 0;
                    staminaContainer.style.opacity = '1';
                    if (stamina <= 0) {
                        isSprinting = false;
                        sprintBtn.classList.remove('active-sprint');
                    }
                } else {
                    staminaRechargeTimer += delta;
                    if (staminaRechargeTimer >= STAMINA_RECHARGE_DELAY && stamina < maxStamina) {
                        stamina = Math.min(maxStamina, stamina + STAMINA_RECHARGE_RATE * delta);
                    }
                }

                if (stamina >= maxStamina && !isSprinting) {
                    staminaContainer.style.opacity = '0';
                } else {
                    staminaContainer.style.opacity = '1';
                }
                drawStaminaWheel();

                // Check proximity & equipped state for Melee button visibility
                closestTargetInRange = null;
                if (isHoldingKnife) {
                    let minDistance = Infinity;
                    for (let t of targets) {
                        if (!t.userData.isHit) {
                            const dist = playerPosition.distanceTo(t.position);
                            if (dist < minDistance) {
                                minDistance = dist;
                                closestTargetInRange = t;
                            }
                        }
                    }

                    if (minDistance <= MELEE_RANGE) {
                        meleeBtn.style.display = 'flex';
                    } else {
                        meleeBtn.style.display = 'none';
                        closestTargetInRange = null;
                    }
                } else {
                    meleeBtn.style.display = 'none';
                }

                // Update Targets
                for (let i = targets.length - 1; i >= 0; i--) {
                    const t = targets[i];

                    if (t.userData.isHit) {
                        t.userData.hitTimer += delta;
                        let scaleStep = 1.0 - (delta / 1.0);
                        t.scale.multiplyScalar(Math.max(0, scaleStep));

                        if (isStuckInTarget && stuckTarget === t) {
                            knife.scale.set(1.2, 1.2, 1.2).divide(t.scale);
                        }

                        if (t.userData.hitTimer >= 1.0) {
                            if (isStuckInTarget && stuckTarget === t) {
                                isStuckInTarget = false;
                                stuckTarget = null;
                                scene.attach(knife);
                                knife.scale.set(1.2, 1.2, 1.2);
                                knifeVelocity.set(0, -2, 0);
                            }
                            scene.remove(t);
                            targets.splice(i, 1);
                            continue;
                        }
                    } else {
                        t.position.y = t.userData.baseY + Math.sin(time * 0.002 * t.userData.hoverSpeed + t.userData.hoverOffset) * 0.3;

                        if (t.userData.behavior === 1) {
                            const dirToPlayer = new THREE.Vector3().subVectors(playerPosition, t.position);
                            dirToPlayer.y = 0;
                            dirToPlayer.normalize();

                            if (t.position.distanceTo(playerPosition) > 4.0) {
                                t.position.addScaledVector(dirToPlayer, t.userData.moveSpeed * delta);
                            }
                            t.lookAt(playerPosition.x, t.position.y, playerPosition.z);
                        } 
                        else if (t.userData.behavior === 2) {
                            t.userData.circleAngle += t.userData.circleSpeed * delta;
                            t.position.x = playerPosition.x + Math.sin(t.userData.circleAngle) * t.userData.circleRadius;
                            t.position.z = playerPosition.z - Math.cos(t.userData.circleAngle) * t.userData.circleRadius;
                            t.lookAt(playerPosition.x, t.position.y, playerPosition.z);
                        }
                        else if (t.userData.behavior === 3) {
                            const dirToPlayer = new THREE.Vector3().subVectors(playerPosition, t.position);
                            dirToPlayer.y = 0;
                            dirToPlayer.normalize();
                            const perp = new THREE.Vector3(-dirToPlayer.z, 0, dirToPlayer.x).multiplyScalar(Math.sin(time * 0.004) * 2.0);
                            t.position.addScaledVector(dirToPlayer.add(perp).normalize(), t.userData.moveSpeed * 1.2 * delta);
                            t.lookAt(playerPosition.x, t.position.y, playerPosition.z);
                        }
                        else if (t.userData.behavior === 0) {
                            const dirToPlayer = new THREE.Vector3().subVectors(playerPosition, t.position);
                            dirToPlayer.y = 0;
                            dirToPlayer.normalize();

                            t.position.addScaledVector(dirToPlayer, t.userData.moveDirection * t.userData.moveSpeed * delta);
                            const distToPlayer = t.position.distanceTo(playerPosition);
                            if (distToPlayer < 7 || distToPlayer > 30) {
                                t.userData.moveDirection *= -1;
                            }
                            t.lookAt(playerPosition.x, t.position.y, playerPosition.z);
                        }

                        // Attack Mode throwing interval
                        t.userData.throwTimer += delta;
                        const throwInterval = isAttackMode ? 2.5 : 5.5;
                        if (t.userData.throwTimer >= throwInterval) {
                            t.userData.throwTimer = 0;
                            spawnEnemyKnife(t);
                        }
                    }
                }

                // Update Enemy Flying Knives
                for (let i = enemyKnives.length - 1; i >= 0; i--) {
                    const ek = enemyKnives[i];
                    ek.velocity.y -= GRAVITY * delta;
                    ek.mesh.position.addScaledVector(ek.velocity, delta);
                    ek.mesh.rotateOnWorldAxis(ek.spinAxis, ek.spinSpeed * delta);

                    if (ek.mesh.position.distanceTo(playerPosition) < 1.3 && Math.abs(ek.mesh.position.y - playerPosition.y) < 1.2) {
                        takeDamage();
                        scene.remove(ek.mesh);
                        enemyKnives.splice(i, 1);
                        continue;
                    }

                    if (ek.mesh.position.y <= 0.35) {
                        ek.mesh.position.y = 0.35;
                        ek.mesh.rotation.set(Math.PI / 2, 0, 0);
                        
                        droppedEnemyKnives.push(ek.mesh);
                        
                        if (droppedEnemyKnives.length > 20) {
                            const oldKnife = droppedEnemyKnives.shift();
                            scene.remove(oldKnife);
                        }

                        enemyKnives.splice(i, 1);
                        continue;
                    }

                    if (ek.mesh.position.length() > 120) {
                        scene.remove(ek.mesh);
                        enemyKnives.splice(i, 1);
                    }
                }

                camera.rotation.x = cameraPitch;
                camera.rotation.y = cameraYaw;

                if (isMoving) {
                    const currentSpeedFactor = (isSprinting && stamina > 0) ? 11.0 : 6.0;
                    const moveSpeed = currentSpeedFactor * delta;
                    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);
                    const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);

                    let nextX = playerPosition.x - moveInput.y * moveSpeed * forward.x - moveInput.x * moveSpeed * side.x;
                    let nextZ = playerPosition.z - moveInput.y * moveSpeed * forward.z - moveInput.x * moveSpeed * side.z;

                    let collided = false;
                    for (let obs of obstacles) {
                        const dist = Math.hypot(nextX - obs.mesh.position.x, nextZ - obs.mesh.position.z);
                        if (dist < obs.radius + 0.4) {
                            collided = true;
                            break;
                        }
                    }

                    if (!collided) {
                        playerPosition.x = nextX;
                        playerPosition.z = nextZ;
                    }
                }

                // Jump & Gravity Physics
                if (isJumping) {
                    playerVerticalVelocity -= GRAVITY * 1.2 * delta;
                    playerPosition.y += playerVerticalVelocity * delta;

                    if (playerPosition.y <= PLAYER_HEIGHT) {
                        playerPosition.y = PLAYER_HEIGHT;
                        playerVerticalVelocity = 0;
                        isJumping = false;
                    }
                }

                camera.position.copy(playerPosition);

                if (isNightMode) {
                    flashlight.position.copy(camera.position);
                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);
                    flashlight.target.position.copy(camera.position).add(camDir.multiplyScalar(20));
                }

                // Knife Logic
                if (isHoldingKnife) {
                    const holdOffset = new THREE.Vector3(0.35, -0.35, -0.8);
                    holdOffset.applyQuaternion(camera.quaternion);
                    knife.position.copy(camera.position).add(holdOffset);
                    knife.rotation.copy(camera.rotation);
                    knife.rotateX(Math.PI / 2);
                } else if (isStuckInTarget) {
                    // Pinned
                } else {
                    knifeVelocity.y -= GRAVITY * delta;
                    knife.position.x += knifeVelocity.x * delta;
                    knife.position.y += knifeVelocity.y * delta;
                    knife.position.z += knifeVelocity.z * delta;

                    knife.rotateOnWorldAxis(spinAxis, spinSpeed * delta);

                    for (let i = 0; i < targets.length; i++) {
                        const t = targets[i];
                        if (!t.userData.isHit && knife.position.distanceTo(t.position) < 1.1) {
                            isStuckInTarget = true;
                            stuckTarget = t;
                            t.userData.isHit = true; 

                            // Increment score and print count live on successful knife throw hits
                            if (isAttackMode) {
                                knockdownScore++;
                                scoreValEl.textContent = knockdownScore;
                                console.log(`Enemy knocked down! Total knockdowns: ${knockdownScore}`);
                            }

                            const hitPoint = knife.position.clone();
                            t.attach(knife); 
                            knife.position.copy(t.worldToLocal(hitPoint));
                            knife.scale.set(1.2, 1.2, 1.2).divide(t.scale);

                            knife.rotation.set(0, 0, 0);
                            knife.rotateX(Math.PI / 2);
                            knife.translateZ(-0.4);
                            break;
                        }
                    }

                    if (!isStuckInTarget && knife.position.y <= 0.35) {
                        knife.position.y = 0.35;
                        knifeVelocity.set(0, 0, 0);
                        spinSpeed = 0;
                        knife.scale.set(1.2, 1.2, 1.2);
                        knife.rotation.set(Math.PI / 2, 0, 0);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
